spring.application.name=ecommerce

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/ecommerce_db
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=none

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT

jwt.secret=${JWT_SECRET}
jwt.expiration=900000
jwt.refresh-expiration=604800000

# R2 Storage
storage.endpoint=${STORAGE_ENDPOINT}
storage.access-key=${STORAGE_ACCESS_KEY}
storage.secret-key=${STORAGE_SECRET_KEY}
storage.bucket=${STORAGE_BUCKET:minimoda-images}
storage.public-url=${STORAGE_PUBLIC_URL}

# Mercado Pago
mercadopago.access-token=${MP_ACCESS_TOKEN}

mercadopago.webhook-secret=${MP_WEBHOOK_SECRET}
mercadopago.notification-url=${MP_NOTIFICATION_URL}

# Mail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.frontend-url=${FRONTEND_URL:http://127.0.0.1:5500}
app.cors.allowed-origins=${CORS_ORIGINS}
# Lista separada por vírgulas dos IPs de proxies autorizados a definir headers forwarded.
app.trusted-proxies=${TRUSTED_PROXIES:}

app.password-token.expiration-hours=1

# HTTP clients
app.http.connect-timeout-ms=${HTTP_CONNECT_TIMEOUT_MS:5000}
app.http.read-timeout-ms=${HTTP_READ_TIMEOUT_MS:10000}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Correios
correios.api-base-url=${CORREIOS_API_BASE_URL:https://api.correios.com.br}
correios.usuario=${CORREIOS_USUARIO}
correios.codigo-acesso=${CORREIOS_CODIGO_ACESSO}
correios.cep-origem=15046806

correios.cartao-postagem=${CORREIOS_CARTAO_POSTAGEM}
correios.numero-contrato=${CORREIOS_NUMERO_CONTRATO}

# Bling
bling.api-base-url=${BLING_API_BASE_URL:https://api.bling.com.br/Api/v3}
bling.client-id=${BLING_CLIENT_ID}
bling.client-secret=${BLING_CLIENT_SECRET}
bling.redirect-uri=${BLING_REDIRECT_URI}
bling.authorize-url=${BLING_AUTHORIZE_URL:https://www.bling.com.br/Api/v3/oauth/authorize}
