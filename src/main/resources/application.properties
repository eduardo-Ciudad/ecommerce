spring.application.name=ecommerce

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/ecommerce_db
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=none

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT

jwt.secret=${JWT_SECRET}
jwt.expiration=900000
jwt.refresh-expiration=604800000

# R2 Storage
storage.endpoint=${STORAGE_ENDPOINT}
storage.access-key=${STORAGE_ACCESS_KEY}
storage.secret-key=${STORAGE_SECRET_KEY}
storage.bucket=${STORAGE_BUCKET:minimoda-images}
storage.public-url=${STORAGE_PUBLIC_URL}

# Mercado Pago
mercadopago.access-token=${MP_ACCESS_TOKEN}

mercadopago.webhook-secret=${MP_WEBHOOK_SECRET}
mercadopago.notification-url=${MP_NOTIFICATION_URL}

# Mail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.frontend-url=${FRONTEND_URL:http://127.0.0.1:5500}
app.cors.allowed-origins=${CORS_ORIGINS}

app.password-token.expiration-hours=1

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB


